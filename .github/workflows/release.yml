name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tên Tag/Version (ví dụ: v1.0.0, bỏ trống để tự động tạo v1.0.<run_number>)'
        required: false
        default: ''
      release_title:
        description: 'Tiêu đề Release (bỏ trống để tự động đặt theo tag)'
        required: false
        default: ''
      prerelease:
        description: 'Đánh dấu là bản thử nghiệm (Pre-release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release sav
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Determine Version Tag & Title
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
              $tag = "${{ github.ref_name }}"
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.tag_name }}")) {
              $tag = "${{ inputs.tag_name }}"
          } else {
              $tag = "v1.0.${{ github.run_number }}"
          }

          Write-Host "Determined release tag: $tag"
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.release_title }}")) {
              $title = "${{ inputs.release_title }}"
          } else {
              $title = "sav $tag"
          }
          echo "TITLE=$title" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore ludusavo/ludusavo.csproj

      - name: Publish sav (Single-File)
        run: |
          dotnet publish ludusavo/ludusavo.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/app

      - name: Cache Inno Setup
        id: cache-innosetup
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: ${{ runner.os }}-innosetup-6

      - name: Install Inno Setup
        if: steps.cache-innosetup.outputs.cache-hit != 'true'
        run: |
          choco install innosetup --no-progress

      - name: Build Setup Installer (.exe with auto-PATH)
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          $version = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force -Path "artifacts"
          
          # Compile Inno Setup
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer.iss

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          Compress-Archive -Path "dist/app/*" -DestinationPath "artifacts/sav-$tag-win-x64.zip" -Force

          Write-Host "Danh sách artifacts tạo ra:"
          Get-ChildItem -Path "artifacts"

      - name: Create Git Tag (nếu chưa có)
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $exists = git tag -l $tag
          if (-not $exists) {
              Write-Host "Creating git tag $tag..."
              git tag -a $tag -m "Release $tag"
              git push origin $tag
          } else {
              Write-Host "Tag $tag đã tồn tại."
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TITLE }}
          files: |
            artifacts/*.exe
            artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
